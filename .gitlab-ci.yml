stages:
  - test
  - lint
  - security
  - build

go-test:
  stage: test
  image: golang:1.26-bookworm
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.gocache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .gocache/
  script:
    - go test ./...

web-build:
  stage: test
  image: node:22-alpine
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline
    - npm run build

go-vet:
  stage: lint
  image: golang:1.26-bookworm
  variables:
    GOPATH: $CI_PROJECT_DIR/.go
    GOCACHE: $CI_PROJECT_DIR/.gocache
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod/
      - .gocache/
  script:
    - go vet ./...

golangci-lint:
  stage: lint
  image: golangci/golangci-lint:latest-alpine
  allow_failure: true
  script:
    - golangci-lint run ./...

web-lint:
  stage: lint
  image: node:22-alpine
  allow_failure: true
  cache:
    key:
      files:
        - web/package-lock.json
    paths:
      - web/.npm/
  script:
    - cd web
    - npm ci --cache .npm --prefer-offline
    - npm run lint

gosec:
  stage: security
  image: golang:1.26-bookworm
  allow_failure: true
  script:
    - go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
    - gosec -exclude-generated -fmt=json -out=gosec-report.json ./...
  artifacts:
    when: always
    paths:
      - gosec-report.json
    expire_in: 30 days

gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  allow_failure: true
  variables:
    GIT_DEPTH: 0
  script:
    - gitleaks detect --source . --verbose --report-path gitleaks-report.json
  artifacts:
    when: always
    paths:
      - gitleaks-report.json
    expire_in: 30 days

.build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:server:
  extends: .build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --provenance=false --sbom=false --target server -t "$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/server:main" .
    - docker push "$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/server:main"

build:crawler:
  extends: .build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --provenance=false --sbom=false --target crawler -t "$CI_REGISTRY_IMAGE/crawler:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/crawler:main" .
    - docker push "$CI_REGISTRY_IMAGE/crawler:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/crawler:main"

build:web:
  extends: .build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - docker build --provenance=false --sbom=false --target web -t "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA" -t "$CI_REGISTRY_IMAGE/web:main" .
    - docker push "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/web:main"

build:server:release:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - MAJOR=$(echo "$VERSION" | cut -d. -f1)
    - MINOR=$(echo "$VERSION" | cut -d. -f1,2)
    - docker build --provenance=false --sbom=false --target server -t "$CI_REGISTRY_IMAGE/server:$VERSION" -t "$CI_REGISTRY_IMAGE/server:$MINOR" -t "$CI_REGISTRY_IMAGE/server:$MAJOR" -t "$CI_REGISTRY_IMAGE/server:stable" .
    - docker push "$CI_REGISTRY_IMAGE/server:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/server:$MINOR"
    - docker push "$CI_REGISTRY_IMAGE/server:$MAJOR"
    - docker push "$CI_REGISTRY_IMAGE/server:stable"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

build:crawler:release:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - MAJOR=$(echo "$VERSION" | cut -d. -f1)
    - MINOR=$(echo "$VERSION" | cut -d. -f1,2)
    - docker build --provenance=false --sbom=false --target crawler -t "$CI_REGISTRY_IMAGE/crawler:$VERSION" -t "$CI_REGISTRY_IMAGE/crawler:$MINOR" -t "$CI_REGISTRY_IMAGE/crawler:$MAJOR" -t "$CI_REGISTRY_IMAGE/crawler:stable" .
    - docker push "$CI_REGISTRY_IMAGE/crawler:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/crawler:$MINOR"
    - docker push "$CI_REGISTRY_IMAGE/crawler:$MAJOR"
    - docker push "$CI_REGISTRY_IMAGE/crawler:stable"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

build:web:release:
  extends: .build
  script:
    - VERSION=${CI_COMMIT_TAG#v}
    - MAJOR=$(echo "$VERSION" | cut -d. -f1)
    - MINOR=$(echo "$VERSION" | cut -d. -f1,2)
    - docker build --provenance=false --sbom=false --target web -t "$CI_REGISTRY_IMAGE/web:$VERSION" -t "$CI_REGISTRY_IMAGE/web:$MINOR" -t "$CI_REGISTRY_IMAGE/web:$MAJOR" -t "$CI_REGISTRY_IMAGE/web:stable" .
    - docker push "$CI_REGISTRY_IMAGE/web:$VERSION"
    - docker push "$CI_REGISTRY_IMAGE/web:$MINOR"
    - docker push "$CI_REGISTRY_IMAGE/web:$MAJOR"
    - docker push "$CI_REGISTRY_IMAGE/web:stable"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

trivy:server:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build:server"]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-server-report.json "$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - trivy-server-report.json
    expire_in: 30 days

trivy:crawler:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build:crawler"]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-crawler-report.json "$CI_REGISTRY_IMAGE/crawler:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - trivy-crawler-report.json
    expire_in: 30 days

trivy:web:
  stage: build
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["build:web"]
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-web-report.json "$CI_REGISTRY_IMAGE/web:$CI_COMMIT_SHA"
  artifacts:
    when: always
    paths:
      - trivy-web-report.json
    expire_in: 30 days
