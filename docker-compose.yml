services:
  server:
    build: .
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      DB_URL: "${DB_URL}"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "screenshots"
      CRAWLER_ADDR: "crawler:50052"
      CRAWLER_TOKEN: "${CRAWLER_TOKEN}"
    depends_on:
      minio:
        condition: service_started
      crawler:
        condition: service_started
    restart: unless-stopped

  crawler:
    build: .
    entrypoint: ["/app/crawler"]
    command:
      - "--listen-addr=:50052"
      - "--grpc-addr=server:50051"
      - "--auth-token=${CRAWLER_TOKEN}"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/screenshots &&
      mc anonymous set public local/screenshots
      "

volumes:
  miniodata:
