syntax = "proto3";

package compliance;

option go_package = "github.com/afif/dns-tracking/proto";

message SiteResult {
  string url           = 1;
  int64  timestamp     = 2;
  bool   compliant     = 3;
  string resolved_ip   = 4;
  bytes  screenshot    = 5;
  string error         = 6;
  string dns_server    = 7;
  int64  latency_ms    = 8;
  string resolved_ipv6 = 9;
}

message ComplianceReport {
  repeated SiteResult results = 1;
}

message Acknowledgement {
  bool ok = 1;
}

service ComplianceService {
  rpc Submit(ComplianceReport) returns (Acknowledgement);
}

message DNSServerConfig {
  string isp      = 1;
  string name     = 2;
  string address  = 3;
  string protocol = 4;
}

message SweepRequest {
  repeated string          urls          = 1;
  repeated DNSServerConfig dns_servers   = 2;
  repeated string          compliant_ips = 3;
  bool                     screenshots   = 4;
  int32                    dns_workers   = 5; // 0 = crawler's own --dns-workers default
}

message SweepAck {
  bool   accepted = 1;
  string error    = 2;
}

service CrawlerControl {
  rpc StartSweep(SweepRequest) returns (SweepAck);
}
