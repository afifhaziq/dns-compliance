server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # TanStack Router is client-side — unknown paths must fall back to
    # index.html so a direct load/refresh on e.g. /urls doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API calls are same-origin relative paths (web/src/api/client.ts) —
    # in production web and server run as separate containers, so nginx
    # must proxy /api/ to the server for that assumption to hold.
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
